name: Deploy GitHub Pages

on:
  push:
    branches: ["main"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Build static site
        run: |
          rm -rf _site
          mkdir _site
          cp -R . _site/
          rm -rf _site/.git _site/.github _site/_site
          python - <<'PY'
          from pathlib import Path
          p = Path('_site/index.html')
          s = p.read_text()
          if 'motion.css' not in s:
              s = s.replace('</head>', '<link rel="stylesheet" href="motion.css" />\n</head>')
          if 'motion.js' not in s:
              s = s.replace('</body>', '<script src="motion.js"></script>\n</body>')
          p.write_text(s)
          PY
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
